commands:
  - name: /brainstorm
    description: Run the Brainstorming Agent
    prompt_path: docs/agents/Brainstormer.md
    include:
      - docs/AUDIT-PROCESS.md
      - audit-state/*.md

  - name: /threatmodel
    description: Run the Threat Modeling Agent
    prompt_path: docs/agents/ThreatModeler.md
    include:
      - docs/AUDIT-PROCESS.md
      - docs/ICTM.md
      - audit-state/*.md

  - name: /localaudit
    description: Run the Local Auditor Agent on a given file
    prompt_path: docs/agents/LocalAuditor.md
    args:
      - name: file
        description: Path to the file inside audit-target/ to audit
        required: true
    include:
      - docs/AUDIT-PROCESS.md
      - audit-state/*.md
      - audit-target/${file}

  - name: /globalaudit
    description: Run the Global Auditor Agent
    prompt_path: docs/agents/GlobalAuditor.md
    include:
      - docs/AUDIT-PROCESS.md
      - audit-state/*.md
      - audit-target/**

  - name: /validate
    description: Run the Issue Validator Agent on a specific issue
    prompt_path: docs/agents/Validator.md
    args:
      - name: issue-id
        description: Identifier or excerpt of the issue to validate
        required: true
    include:
      - docs/AUDIT-PROCESS.md
      - audit-state/*.md

  - name: /report
    description: Run the Report Generator Agent
    prompt_path: docs/agents/ReportGenerator.md
    include:
      - docs/AUDIT-PROCESS.md
      - audit-state/*.md
      - docs/example-report/**

  - name: /audit
    description: Run the full audit process with the Coordinator Agent
    prompt_path: docs/agents/Coordinator.md
    include:
      - docs/AUDIT-PROCESS.md
      - docs/ICTM.md
      - audit-state/*.md
      - audit-target/**
